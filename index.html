<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SPA Redirect Script for GitHub Pages -->
  <script type="text/javascript">
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>

  <!-- SEO Meta Tags -->
  <title>LEVIATOR | Haute Parfumerie & 3D Olfactory Experience</title>
  <meta name="description"
    content="Immerse in the luxury of LEVIATOR Haute Parfumerie. Discover handcrafted artisanal fragrances in an interactive 3D sensory environment." />
  <meta name="keywords"
    content="LEVIATOR, luxury perfume, haute parfumerie, artisanal fragrance, 3D perfume experience, bespoke scents, L'Or Blanc, Vortex Impérial" />
  <meta name="theme-color" content="#0a0a0c" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
</head>
